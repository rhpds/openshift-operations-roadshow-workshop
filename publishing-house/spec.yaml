# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: null
    assessment_strategy: ""
    catalog_gap: ""
    design_overview: "A hands-on operations workshop covering 18 modules across the full breadth of OpenShift administration. Participants work through cluster verification, application lifecycle, networking, security, identity management, observability, virtualization, multi-cluster management, and developer tooling on a dedicated OpenShift 4.20+ compact cluster with pre-installed operators."
    module_summaries:
      - title: "Setup & Overview"
        overview: "Introduces the workshop, verifies cluster access, and tours built-in OpenShift platform capabilities including monitoring, registry, ingress, MachineSets, and OperatorHub."
      - title: "Installation & Verification"
        overview: "Post-installation verification checks covering ClusterOperators, cluster version, MachineConfigPools, networking, storage provisioning, and etcd health."
      - title: "Application Management Basics"
        overview: "Core application lifecycle including deployment, TLS routes, horizontal scaling, self-healing, probes, rolling rollback, and PodDisruptionBudgets."
      - title: "Ingress & Load Balancing"
        overview: "OpenShift Ingress Controller configuration with TLS termination options, HTTP-to-HTTPS redirect, HSTS headers, and rate limiting."
      - title: "Network Security"
        overview: "OVN-Kubernetes network security with deny-all NetworkPolicy, cross-namespace rules, AdminNetworkPolicy, EgressFirewall, and EgressIP."
      - title: "Debugging & Troubleshooting"
        overview: "Six intentionally broken microservices covering ImagePullBackOff, CrashLoopBackOff, resource constraints, ConfigMap errors, selector mismatches, and SCC violations."
      - title: "GitOps - Declarative Cluster Management"
        overview: "ArgoCD for cluster configuration management with Git-based deployment, drift detection, resync, and self-healing."
      - title: "Identity - LDAP"
        overview: "LDAP identity provider integration with JumpCloud, group sync, and group-based RBAC across dev/test/prod projects."
      - title: "Identity - OIDC"
        overview: "Red Hat build of Keycloak deployment, OIDC integration, automatic group sync from token claims, and RBAC configuration."
      - title: "Observability & Logging"
        overview: "Full observability stack covering Prometheus metrics and dashboards, Alertmanager alerting with email notifications, Loki/Vector logging with S3 storage, and Tempo/OpenTelemetry distributed tracing."
      - title: "Performance Tuning"
        overview: "Application right-sizing using VPA recommendations, HPA horizontal autoscaling under load, and capacity planning."
      - title: "Virtualization"
        overview: "RHEL 9 VM provisioning via InstanceTypes, unified monitoring and networking, live migration, cloning, and snapshot/restore."
      - title: "Developer Hub"
        overview: "Software catalog with live Kubernetes data, golden path templates for self-service provisioning, operational troubleshooting, and Prometheus monitoring for RHDH."
      - title: "Lightspeed"
        overview: "OpenShift Lightspeed deployment with Azure OpenAI GPT-4 for concept learning, YAML generation, and natural language troubleshooting."
      - title: "ACM Multi-Cluster Management"
        overview: "RHACM for creating HCP clusters, multi-cluster application deployment via ArgoCD ApplicationSets, and GDPR governance policy enforcement."
      - title: "Advanced Cluster Security"
        overview: "RHACS compliance scanning against CIS, PCI-DSS, and STIG benchmarks with Policy-as-Code runtime enforcement and violation auditing."
      - title: "Secrets Management"
        overview: "HashiCorp Vault deployment via Helm with Kubernetes auth, Vault Agent Injector pattern, and External Secrets Operator pattern."
      - title: "Zero-Trust Workload Identity Manager"
        overview: "SPIFFE/SPIRE-based workload identity with mTLS for PostgreSQL, zero-trust enforcement, and automatic certificate rotation."
      - title: "Wrap Up"
        overview: "Brief conclusion with resource links for continued learning."
    rcars_overlap_pct: 98
    rcars_top_matches:
      - title: "Hands-on lab with Red Hat OpenShift Platform Plus (2025)"
        ci_name: "sandboxes-gpte.opp-hol.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=sandboxes-gpte.opp-hol.prod"
        relevance_score: 98
        why_it_fits: "Covers RHACS, RHACM, OpenShift GitOps, and OpenShift Virtualization with hands-on exercises spanning multi-cluster management, security policy enforcement, and VM lifecycle management."
      - title: "Advanced Cluster Management for Kubernetes Demo"
        ci_name: "published.ocp4-acm-demo.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=published.ocp4-acm-demo.prod"
        relevance_score: 87
        why_it_fits: "Covers RHACM multi-cluster management, OpenShift Virtualization fleet operations, GitOps with ArgoCD, governance policies, and multicluster observability."
      - title: "Sovereign Cloud Architecture with OpenShift"
        ci_name: "published.sovereign-cloud-lab.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=published.sovereign-cloud-lab.prod"
        relevance_score: 84
        why_it_fits: "Covers RHACM multi-cluster management, RHACS compliance scanning, OpenShift Virtualization, and GitOps with ArgoCD."
    catalog_gap: "This roadshow covers the full breadth of OpenShift operations in a single workshop. No existing catalog item combines LDAP/OIDC identity management, full-stack observability (metrics + logging + tracing), performance tuning (VPA/HPA), debugging broken pods, secrets management with Vault/ESO, and ZTWIM zero-trust workload identity."
    rejections: []

