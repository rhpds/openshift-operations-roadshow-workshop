      duration_min: 5
      status: not_started
  environment:
    platform: "ocp"
    topology: "per-student"
    cloud_provider: cnv
    max_concurrent_users: null

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: "4.20"
    cluster_type: "multinode"
    control_plane_instance_count: 3
    control_plane_cpu: 16
    control_plane_ram_gb: 64
    worker_count: 0                    # compact cluster — control plane nodes also serve as workers
    worker_cpu: null
    worker_ram_gb: null
    worker_disk_gb: null

    # --- VM-specific fields (only when platform = rhel-vms) ---
