  owner_email: "jgavant@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "classic"
  intake_type: "migration"
  automation_type: "ansible"
  description: "A multi-module workshop on OpenShift operations. Deep technical background on core components and addons for OpenShift operations."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-1046"
  workflow_id: "5d703d43-f92c-4de0-9119-05a35d0a1718"

spec:
  title: "OpenShift Ops Day Roadshow"
  learning_objectives:
    - "Verify post-installation cluster health including ClusterOperators, MachineConfigPools, networking, storage provisioning, and etcd metrics"
    - "Deploy and scale applications with self-healing, rolling updates, readiness/liveness probes, and PodDisruptionBudgets"
    - "Configure ingress routing with TLS termination, HSTS headers, and rate limiting via the OpenShift Ingress Controller"
    - "Implement network security using NetworkPolicy, AdminNetworkPolicy, EgressFirewall, and EgressIP on OVN-Kubernetes"
    - "Troubleshoot common pod failures including ImagePullBackOff, CrashLoopBackOff, resource constraints, and SCC violations"
    - "Deploy declarative cluster configuration using ArgoCD with drift detection and self-healing"
    - "Integrate LDAP and OIDC identity providers with group sync and role-based access control"
    - "Configure full-stack observability across metrics, alerting, logging, and distributed tracing using Prometheus, Alertmanager, Loki, Vector, Tempo, and OpenTelemetry"
    - "Implement horizontal and vertical pod autoscaling with capacity planning based on VPA recommendations"
    - "Provision and manage virtual machines on OpenShift Virtualization with live migration, cloning, and snapshots"
    - "Manage multi-cluster environments using RHACM with hosted control planes, ArgoCD ApplicationSets, and governance policies"
    - "Secure workloads using RHACS compliance scanning, secrets management with HashiCorp Vault and External Secrets Operator, and SPIFFE/SPIRE zero-trust workload identity"
  modules:
    - id: module-01
      title: "Setup & Overview"
      duration_min: 20
      status: not_started
    - id: module-02
      title: "Installation & Verification"
      duration_min: 10
      status: not_started
    - id: module-03
      title: "Application Management Basics"
      duration_min: 20
      status: not_started
    - id: module-04
      title: "Ingress & Load Balancing"
      duration_min: 25
      status: not_started
    - id: module-05
      title: "Network Security"
      duration_min: 15
      status: not_started
    - id: module-06
      title: "Debugging & Troubleshooting"
      duration_min: 15
      status: not_started
    - id: module-07
      title: "GitOps - Declarative Cluster Management"
      duration_min: 15
      status: not_started
    - id: module-08
      title: "Identity - LDAP"
      duration_min: 20
      status: not_started
    - id: module-09
      title: "Identity - OIDC"
      duration_min: 20
      status: not_started
    - id: module-10
      title: "Observability & Logging"
      duration_min: 40
      status: not_started
    - id: module-11
      title: "Performance Tuning"
      duration_min: 20
      status: not_started
    - id: module-12
