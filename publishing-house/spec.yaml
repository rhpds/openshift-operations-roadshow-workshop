      duration_min: 30
      status: not_started
    - id: module-16
      title: "Advanced Cluster Security"
      duration_min: 20
      status: not_started
    - id: module-17
      title: "Secrets Management"
      duration_min: 25
      status: not_started
    - id: module-18
